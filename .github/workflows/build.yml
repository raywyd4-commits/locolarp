name: LocationChanger
options:
  bundleIdPrefix: com.ray
  deploymentTarget:
    iOS: "17.0"
targets:
  LocationChanger:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Location Changer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Shows your location on the map and lets you test a simulated location inside this app."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ray.locationchanger
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
