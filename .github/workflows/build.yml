name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: npm install
      - name: Add iOS project
        run: npx cap add ios
      - name: Sync web files
        run: npx cap sync ios
      - name: Build unsigned app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r LocoLarp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LocoLarp-ipa
          path: LocoLarp.ipa
